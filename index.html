<!DOCTYPE html>
<html lang="mr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SAMRAJYA FINANCE CRM</title>
<style>
*{box-sizing:border-box}
body{margin:0;font-family:Arial,sans-serif;background:#f2f5fa;color:#172033}
header{background:#10284b;color:white;padding:20px}
header h1{margin:0}
.container{max-width:1100px;margin:25px auto;padding:15px}
.card,.stat{background:white;padding:20px;border-radius:12px;box-shadow:0 3px 14px #0001;margin-bottom:16px}
input,button{padding:12px;margin:6px 0;border-radius:7px;border:1px solid #ccd5e3;width:100%;font-size:15px}
button{background:#123d73;color:white;cursor:pointer}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:12px}
#dashboard{display:none}
</style>
</head>
<body>
<header>
<h1>🏦 SAMRAJYA FINANCE</h1>
<p>Online CRM | Loan Lead Management System</p>
</header>
<div class="container">
<section class="card" id="login">
<h2>Admin / Team Login</h2>
<form id="loginForm">
<label>Email ID / ईमेल</label>
<input id="email" type="email" required>
<label>Password / पासवर्ड</label>
<input id="password" type="password" required>
<button type="submit">Login / लॉगिन</button>
</form>
<p id="message"></p>
</section>
<section id="dashboard">
<div class="card">
<h2>Dashboard / डॅशबोर्ड</h2>
<p id="welcome"></p>
<button id="logout">Logout / बाहेर पडा</button>
</div>
<div class="grid">
<div class="stat">New Leads <h2 id="newCount">0</h2></div>
<div class="stat">Login <h2 id="loginCount">0</h2></div>
<div class="stat">Approval <h2 id="approvalCount">0</h2></div>
<div class="stat">Disbursement <h2 id="disbursementCount">0</h2></div>
<div class="stat">Rejected <h2 id="rejectedCount">0</h2></div>
</div>
<div class="card">
<h3>Lead Management / लीड व्यवस्थापन</h3>
<p>पुढील टप्प्यात Database जोडून Lead Entry, Follow-up आणि Reports सुरू करू.</p>
</div>
</section>
</div>
</body>
</html>
